name: Deploy results dashboard

on:
  push:
    branches:
      - main
    paths:
      - "reports/redactor_results_dashboard.html"
      - "reports/redactor_results.csv"
      - "reports/full_dataset_results.json"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp reports/redactor_results_dashboard.html _site/index.html
          cp reports/redactor_results.csv _site/redactor_results.csv
          cp reports/full_dataset_results.json _site/full_dataset_results.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
